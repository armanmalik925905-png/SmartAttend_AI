<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Logged Out - SmartAttend</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #2563eb, #1e40af);
        }

        .logout-box {
            width: 420px;
            background: white;
            padding: 45px 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .icon {
            font-size: 65px;
            margin-bottom: 20px;
        }

        h1 {
            color: #1e40af;
            margin-bottom: 12px;
        }

        p {
            color: #555;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .login-btn {
            display: inline-block;
            text-decoration: none;
            background: #2563eb;
            color: white;
            padding: 13px 30px;
            border-radius: 8px;
            font-weight: bold;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .brand {
            margin-top: 25px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="logout-box">

        <div class="icon">👋</div>

        <h1>Logged Out Successfully</h1>

        <p>
            You have been successfully logged out
            from the SmartAttend Admin Panel.
        </p>

        <a href="index.html" class="login-btn">
            🔐 Login Again
        </a>

        <div class="brand">
            🎓 Smart Attend
        </div>

    </div>

</body>
</html>
