<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stylish Login Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #f7f7f7,
                #6da1fa,
                #00c6ff
            );
        }

        .login-box {
            width: 380px;
            padding: 40px;

            background: rgba(255, 255, 255, 0.15);
            border-radius: 20px;

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.3);

            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);

            color: white;
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .login-box p {
            text-align: center;
            margin-bottom: 30px;
            color: #eee;
        }

        .input-box {
            margin-bottom: 20px;
        }

        .input-box label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .input-box input {
            width: 100%;
            padding: 13px 15px;

            border: none;
            outline: none;
            border-radius: 10px;

            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 15px;
        }

        .input-box input:focus {
            box-shadow: 0 0 10px #00eaff;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 25px;
            font-size: 14px;
        }

        .options a {
            color: white;
            text-decoration: none;
        }

        .options a:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(
                90deg,
                #2b48c8,
                #3274ee
            );

            color: white;
            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .signup {
            text-align: center;
            margin-top: 25px;
        }

        .signup a {
            color: #fff;
            font-weight: bold;
            text-decoration: none;
        }

        .signup a:hover {
            text-decoration: underline;
        }

        @media (max-width: 450px) {
            .login-box {
                width: 90%;
                padding: 30px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Welcome Back!</h1>

        <p>Login to your account</p>

         <form action="admin.html" method="get">

            <div class="input-box">
                <label>Email</label>
                <input 
                    type="email" 
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="input-box">
                <label>Password</label>
                <input 
                    type="password" 
                    placeholder="Enter your password"
                    required
                >
            </div>

            <div class="options">

                <label>
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#">Forgot Password?</a>

            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div class="signup">
            Don't have an account?
            <a href="#">Sign Up</a>
        </div>

    </div>

</body>
</html>
